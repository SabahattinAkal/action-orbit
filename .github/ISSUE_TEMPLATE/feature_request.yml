name: Özellik isteği
description: Bir kullanıcı problemi ve çözüm önerisi paylaş
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Kullanıcı problemi
      description: Hangi işi bugün yapmak zor veya imkânsız?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Önerilen çözüm
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatifler
      description: Denediğin geçici çözümler veya benzer uygulama örnekleri.
