name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: C# security analysis
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: csharp
          build-mode: manual

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        run: |
          dotnet restore ActionOrbit.slnx --locked-mode
          dotnet restore src/ActionOrbit.App/ActionOrbit.App.csproj --runtime win-x64 --locked-mode

      - name: Build
        run: dotnet build ActionOrbit.slnx --configuration Release --no-restore

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:csharp
