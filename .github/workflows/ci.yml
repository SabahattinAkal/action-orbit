name: build-test-package

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check public source content
        shell: pwsh
        run: ./scripts/Test-PublicSource.ps1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore ActionOrbit.slnx --locked-mode

      - name: Restore win-x64 runtime
        run: dotnet restore src/ActionOrbit.App/ActionOrbit.App.csproj --runtime win-x64 --locked-mode

      - name: Build
        run: dotnet build ActionOrbit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ActionOrbit.App.Tests/ActionOrbit.App.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish win-x64
        run: dotnet publish src/ActionOrbit.App/ActionOrbit.App.csproj --configuration Release --no-restore -p:PublishProfile=win-x64 -p:ContinuousIntegrationBuild=true

      - name: Check package privacy and build setup
        shell: pwsh
        run: |
          ./scripts/Assert-PublishContent.ps1 -PublishDirectory 'src/ActionOrbit.App/bin/publish/win-x64'
          ./scripts/Test-PackagingGuards.ps1
          $compiler = ./scripts/Install-InnoCompiler.ps1 -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'inno-compiler')
          ./scripts/build-setup.ps1 -IsccPath $compiler -PublishDirectory 'src/ActionOrbit.App/bin/publish/win-x64'

      - name: Test Windows setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'artifacts/setup' -File -Filter '*-Setup-win-x64.exe'
          if (@($setup).Count -ne 1) { throw 'Expected one Windows setup.' }
          ./scripts/Test-Setup.ps1 -SetupPath $setup.FullName `
            -ExpectedCommit '${{ github.sha }}' -ReportPath 'artifacts/setup/setup-smoke-report.json'
          $summary = Get-Content 'artifacts/setup/setup-smoke-report.json' -Raw | ConvertFrom-Json
          if (-not $summary.succeeded) { throw 'Setup summary is missing or failed.' }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ActionOrbitPro-win-x64
          path: |
            artifacts/setup/*-Setup-win-x64.exe
            artifacts/setup/*.sha256
            artifacts/setup/setup-smoke-report.json
          if-no-files-found: error
